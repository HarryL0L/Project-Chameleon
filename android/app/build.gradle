plugins {
    id "com.android.application"
}

android {
    namespace = "io.github.harryl0l.chameleon"
    compileSdk = 34
    ndkVersion = "26.3.11579264"

    defaultConfig {
        applicationId = "io.github.harryl0l.chameleon"
        // ASurfaceControl / ASurfaceTransaction need API 29.
        minSdk = 29
        targetSdk = 34
        versionCode = 1
        versionName = "0.1.0"
        ndk {
            abiFilters.add("arm64-v8a")
        }
    }

    // The release key, from the repository's secrets in CI (build.yml).
    // Without it (forks, local builds) Android's debug key signs instead, and
    // such an APK can't be installed over a release.
    signingConfigs {
        def keystore = System.getenv("CHAMELEON_KEYSTORE")
        if (keystore) {
            chameleon {
                storeFile = file(keystore)
                storePassword = System.getenv("CHAMELEON_KEYSTORE_PASSWORD")
                keyAlias = "chameleon"
                keyPassword = System.getenv("CHAMELEON_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.findByName("chameleon") ?: signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.findByName("chameleon")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
}
