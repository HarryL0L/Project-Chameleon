name: Build

on:
  push:
    branches: ["**"] # not tags: release.yml builds those
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml
    inputs:
      version:
        description: "Release version (v0.1.0); empty for a dev build"
        type: string
        default: ""

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      - name: Build presenter APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          CHAMELEON_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Signed with the release key when the secrets are there (not in
          # forks or their pull requests); a release must be.
          if [ -n "$KEYSTORE_BASE64" ]; then
            export CHAMELEON_KEYSTORE="$RUNNER_TEMP/chameleon.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$CHAMELEON_KEYSTORE"
          elif [ -n "$RELEASE_VERSION" ]; then
            echo "::error::a release needs the signing secrets"
            exit 1
          fi
          gradle --no-daemon -p android assembleDebug
          rm -f "$RUNNER_TEMP/chameleon.jks"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/chameleon.apk
          # The NDK the app build uses (android/app/build.gradle ndkVersion).
          echo "NDK_CC=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"

      - name: Build the probe with the NDK
        run: |
          "$NDK_CC" -O2 -Wall -Wextra -o out/ahb_probe probe/ahb_probe.c -ldl

      - name: Build the shim (chameleon/) with the NDK
        run: |
          CC="$NDK_CC" shim/build-android.sh out/chameleon

      - name: Termux package (.deb)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Commit time first, so newer builds always sort higher for apt (the
          # hash alone compares at random: 4d83f62 < d7f4a01).
          VERSION="0.1.0~git$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="${RELEASE_VERSION#v}"
          fi
          packaging/build-deb.sh out/chameleon out/ahb_probe "$VERSION" out/
          dpkg-deb --info out/chameleon_*_aarch64.deb
          dpkg-deb --contents out/chameleon_*_aarch64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: chameleon-${{ github.sha }}
          path: out/

  shim-host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libdrm, libwayland, glvnd
        run: sudo apt-get update -q && sudo apt-get install -y -q libdrm-dev libwayland-dev libegl-dev libgles-dev
      - name: Fake KMS device against the real libdrm
        run: shim/test/run-host-test.sh
