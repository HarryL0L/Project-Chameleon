name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build presenter APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Build Termux tools (probe, demo) with the NDK
        run: |
          CC="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p out
          "$CC" -O2 -Wall -Wextra -o out/ahb_probe probe/ahb_probe.c -ldl
          "$CC" -O2 -Wall -Wextra -Icommon -o out/chameleon_demo termux/demo/chameleon_demo.c -ldl -lm
          cp android/app/build/outputs/apk/debug/app-debug.apk out/chameleon.apk

      - name: Build the KWin shim with the NDK
        run: |
          CC="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            shim/build-android.sh out/kwin-shim

      - uses: actions/upload-artifact@v4
        with:
          name: chameleon-${{ github.sha }}
          path: out/

  shim-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libdrm, libwayland, glvnd
        run: sudo apt-get update -q && sudo apt-get install -y -q libdrm-dev libwayland-dev libegl-dev libgles-dev
      - name: Fake KMS device against the real libdrm
        run: shim/test/run-host-test.sh
